<!DOCTYPE html>
<html>
    <head>
        <title>Chat</title>
    </head>
    <body>
        <h1>Welcome to my  mini cloud Chat-Room</h1>
        <h2>Please, submit your username and select a room</h2>

        <!-- Ingresar nombre de usuario-->
        <form id="joinForm">
            <input type="text" id="username" placeholder="Username" autocomplete="off" required />

            <!-- Ingresar a la sala de chat -->
            <label for="room">Select Room:</label>
            <select id="room">
                <option value="room1">Room 1</option>
                <option value="room2">Room 2</option>
                <option value="room3">Room 3</option>
            </select>
            <button type="submit">Join</button>
        </form>
        
        <!-- Intarfaz del chat -->
        <div id="chat" style="display:none; margin-top:20px;">
            <h3>Chat - <span id="currentRoom"></span></h3>
            <div>
                <label for="roomSelect">Change room:</label>
                <select id="roomSelect">
                    <option value="room1">Room 1</option>
                    <option value="room2">Room 2</option>
                    <option value="room3">Room 3</option>
                </select>
                <button id="changeRoomBtn">Go</button>
                <button id="leaveBtn" type="button">Leave</button>
            </div>
            <ul id='messages' style="border:1px solid #ccc; padding:10px; height:300px; overflow:auto;"></ul>
            <form id="msgForm">
                <input type="text" id="messageText" autocomplete="off" placeholder="Type message..." required/>
                <button>Send</button>
            </form>
        </div>

        <div id="status" style="color:red; margin-top:10px;"></div>

        <script>
            let ws;
            let username;
            let currentRoom;

            const joinForm = document.getElementById('joinForm');
            const msgForm = document.getElementById('msgForm');
            const messages = document.getElementById('messages');
            const chatDiv = document.getElementById('chat');
            const statusDiv = document.getElementById('status');
            const roomSelect = document.getElementById('room');
            const roomSelectChange = document.getElementById('roomSelect');
            const leaveBtn = document.getElementById('leaveBtn');

            function appendMessage(text){
                const li = document.createElement('li');
                li.textContent = text;
                messages.appendChild(li);
                messages.scrollTop = messages.scrollHeight;
            }

            joinForm.addEventListener('submit', function(e){
                e.preventDefault();
                username = document.getElementById('username').value.trim();
                currentRoom = roomSelect.value;
                if(!username){
                    statusDiv.textContent = 'Username required';
                    return;
                }

                // abrir websocket y enviar join
                ws = new WebSocket('ws://' + window.location.host + '/ws');
                ws.addEventListener('open', function(){
                    ws.send(JSON.stringify({ type: 'join', user: username, room: currentRoom }));
                });

                ws.addEventListener('message', function(event){
                    try{
                        const msg = JSON.parse(event.data);
                        if(msg.type === 'join_response'){
                            if(msg.ok){
                                statusDiv.textContent = '';
                                document.getElementById('currentRoom').textContent = currentRoom;
                                chatDiv.style.display = 'block';
                                joinForm.style.display = 'none';
                            } else {
                                statusDiv.textContent = 'Join failed: ' + (msg.reason || 'unknown');
                                ws.close();
                            }
                        } else if(msg.type === 'message'){

                            if(msg.room === currentRoom){
                                appendMessage(msg.ts + ' [' + msg.user + ']: ' + msg.text);
                            }
                        } else if(msg.type === 'join_room_response'){
                            if(msg.ok){
                                messages.innerHTML = '';
                                currentRoom = msg.room;
                                document.getElementById('currentRoom').textContent = currentRoom;
                                // mostrar un aviso que indica que te uniste
                                appendMessage('Joined room ' + currentRoom);

                            } else {
                                appendMessage('Failed to join room: ' + (msg.reason||''));
                            }
                        } else if(msg.type === 'error'){
                            appendMessage('Error: ' + msg.msg);
                        }
                    }catch(err){
                        console.error('invalid message', event.data);
                    }
                });

                ws.addEventListener('close', function(){
                    appendMessage('Disconnected from server');
                });
            });

            msgForm.addEventListener('submit', function(e){
                e.preventDefault();
                const input = document.getElementById('messageText');
                const text = input.value.trim();
                if(!text) return;
                const payload = { type: 'message', room: currentRoom, text };
                ws.send(JSON.stringify(payload));
                input.value = '';
            });

            document.getElementById('changeRoomBtn').addEventListener('click', function(){
                const newRoom = roomSelectChange.value;
                if(ws && newRoom){
                    ws.send(JSON.stringify({ type: 'join_room', room: newRoom }));
                }
            });

            document.getElementById('leaveBtn').addEventListener('click', function(){
                if (ws) {
                    ws.close();
                    chatDiv.style.display = 'none';
                    joinForm.style.display = 'block';
                    messages.innerHTML = '';
                    statusDiv.textContent = 'You have left the chat.';
                }
            })
        </script>
    </body>
</html>
